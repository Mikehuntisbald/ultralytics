  COCO_WholeBody: 22
  3DPW: 18
  AGORA: 18
  COCO_person_mask: 6
  OCHuman: 3
  ADE20K: "0-2"

augmentation:
  source_aware_mix:
    enabled: true
    applies_to: [mosaic, mixup, copy_paste_mixup]
    domain_key: det_class_mask
    rule: mix only samples with the same detection supervision domain
    note: prevents Objects365, person-only, and face-only sources from collapsing class supervision by mask intersection.
  det_aug: {mosaic: 0.7, mixup: 0.1, copy_paste: 0.1, scale: [0.5, 1.5], hsv: true, blur: 0.05}
  pose_mask_aug: {mosaic: 0.1, mixup: 0.0, scale: [0.7, 1.3], rotate: [-10, 10], flip: 0.5}
  pose25d_aug: {mosaic: 0.0, mixup: 0.0, copy_paste: 0.0, scale: [0.8, 1.2], rotate: [-10, 10], flip: 0.5}
  agora_aug: {mosaic: 0.0, mixup: 0.0, scale: [0.8, 1.2], rotate: [-10, 10], flip: 0.5, occlusion_aug: mild}
  scene_aug: {random_crop: true, scale: [0.5, 2.0], flip: 0.5, color_jitter: true}

optimizer_batch:
  prefer_native_yolo26_optimizer_scheduler: true
  optimizer: MuSGD
  scheduler: cosine
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  ema: true
  amp: true
  recommended:
    batch_per_gpu: 18
    accumulate: 4
    effective_batch: 72

total_epochs: 400
