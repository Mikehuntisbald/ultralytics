  COCO_person_mask: 6
  OCHuman: 3
  ADE20K: "0-2"

augmentation:
  source_aware_mix:
    enabled: true
    applies_to: [mosaic, mixup, copy_paste_mixup]
    domain_key: det_class_mask
    rule: mix only samples with the same detection supervision domain
    note: prevents Objects365, person-only, and face-only sources from collapsing class supervision by mask
      intersection.
  det_aug:
    mosaic: 0.7
    mixup: 0.1
    copy_paste: 0.1
    scale: [0.5, 1.5]
    hsv: true
    blur: 0.05
  pose_mask_aug:
    mosaic: 0.1
    mixup: 0.0
    scale: [0.7, 1.3]
    rotate: [-10, 10]
    flip: 0.5
  pose25d_aug:
