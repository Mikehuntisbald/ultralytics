    copy_paste: 0.0
    scale: [0.8, 1.2]
    rotate: [-10, 10]
    flip: 0.5
  agora_aug:
    mosaic: 0.0
    mixup: 0.0
    scale: [0.8, 1.2]
    rotate: [-10, 10]
    flip: 0.5
    occlusion_aug: mild
  scene_aug:
    random_crop: true
    scale: [0.5, 2.0]
    flip: 0.5
    color_jitter: true

optimizer_batch:
  prefer_native_yolo26_optimizer_scheduler: true
  optimizer: MuSGD
  scheduler: cosine
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  ema: true
  amp: true
  recommended:
    batch_per_gpu: 18
    accumulate: 4
    effective_batch: 72

total_epochs: 400
