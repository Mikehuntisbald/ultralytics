# YOLO26 person-scene 2.5D multi-task model with P2/4 - P5/32 outputs.
# Use as yolo26s-ps25d.yaml for the requested s scale.
# Dynamic input is supported. Pad/letterbox to stride 32 because the neck includes P5/32.
# Default 768x432 content should run as imgsz=[448,768] in Ultralytics height,width order.

# Parameters
nc: 366 # Objects365 remap classes + face
scene_nc: 150 # ADE20K semantic classes
person_cls: 0 # Objects365 Person class
face_cls: 365 # extra WIDER FACE class after Objects365 classes
end2end: True # NMS-free topK deployment path
reg_max: 1 # YOLO26 DFL bins
kpt_shape: [17, 4] # deployment: x_norm, y_norm, z_norm, conf
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# P2-P5 PAN/FPN neck. Base 384 channels gives 192 channels for the s scale.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [384, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [384, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [384, True]] # 19 (P2/4)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 16], 1, AlignConcat, [1]] # cat head P3
  - [-1, 2, C3k2, [384, True]] # 22 (P3/8)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, AlignConcat, [1]] # cat head P4
  - [-1, 2, C3k2, [384, True]] # 25 (P4/16)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [384, True, 0.5, True]] # 28 (P5/32)

  # Medium-light pose PAN/FPN runs in parallel with the detection neck and consumes only backbone features.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]] # cat backbone P4
  - [-1, 1, C3k2, [256, True]] # 31

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]] # cat backbone P3
  - [-1, 1, C3k2, [256, True]] # 34

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]] # cat backbone P2
  - [-1, 1, C3k2, [256, True]] # 37 (pose P2/4)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 34], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 40 (pose P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 43 (pose P4/16)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True, 0.5, True]] # 46 (pose P5/32)

  - [[19, 22, 25, 28, 37, 40, 43, 46], 1, YOLO26PSDetect25D, [nc, kpt_shape, 32, 192, 150, 0]]
