# YOLO26 person-scene 2.5D model whose pose branch mirrors the official YOLO26-pose P3-P5 neck/head.
# The full Objects365+face detector remains on the original PS25D P2-P5 det neck; the body25d branch uses a
# separate YOLO26-pose neck and a Pose26-style person box/cls + keypoint head with one extra learnable z channel.

nc: 366
scene_nc: 150
person_cls: 0
face_cls: 365
end2end: True
reg_max: 1
kpt_shape: [17, 4]
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Original PS25D detector neck, P2-P5.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 19 (det P2/4)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 16], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 22 (det P3/8)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 25 (det P4/16)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [384, True, 0.5, True]] # 28 (det P5/32)

  # Official YOLO26-pose neck, P3-P5, in parallel with the detector neck.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 31

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 34 (pose P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 37 (pose P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 40 (pose P5/32)

  - [[19, 22, 25, 28, 34, 37, 40], 1, YOLO26PSDetect25D, [nc, kpt_shape, 32, 192, 150, 0, null, 3, pose26]]
