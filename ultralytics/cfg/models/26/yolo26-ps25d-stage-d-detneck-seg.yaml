# YOLO26-PS Stage D person-mask model.
# Reuses the PS detector backbone and 192-channel detector neck, then maps frozen
# PAN P2-P5 features into the official YOLO26s-seg head contract.

nc: 1
person_cls: 0
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Original PS25D detector neck.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 19 (det P2/4)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 16], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 22 (det P3/8)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 25 (det P4/16)

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [384, True, 0.5, True]] # 28 (det P5/32)

  # P2 refines adapted P3, then P3/P4/P5 are adapted 192 -> 128/256/512
  # for the official YOLO26s-seg head.
  - [[19, 22, 25, 28], 1, YOLO26PSAdapterSegment, [nc, 32, 256, 0]]
