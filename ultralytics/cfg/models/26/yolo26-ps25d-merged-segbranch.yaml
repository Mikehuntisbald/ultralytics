# YOLO26-PS full det/pose2.5D model with an added Stage-D yolo26-seg branch.
# Layers 0-46 match yolo26-ps25d.yaml. Layers 47-58 mirror the independent
# Stage-D segmentation neck. The final merged head preserves the original
# YOLO26PSDetect25D path and uses the appended seg branch only for mask decoding.

nc: 366
scene_nc: 150
person_cls: 0
face_cls: 365
seg_nc: 1
end2end: True
reg_max: 1
kpt_shape: [17, 4]
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Original PS detection neck, P2-P5.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 19 det P2/4

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 16], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 22 det P3/8

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, AlignConcat, [1]]
  - [-1, 2, C3k2, [384, True]] # 25 det P4/16

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [384, True, 0.5, True]] # 28 det P5/32

  # Original PS pose neck, P2-P5.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 31

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 34

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 37 pose P2/4

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 34], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 40 pose P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True]] # 43 pose P4/16

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, AlignConcat, [1]]
  - [-1, 1, C3k2, [256, True, 0.5, True]] # 46 pose P5/32

  # Independent Stage-D yolo26-seg neck.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 49

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 52 seg P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 49], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 55 seg P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 58 seg P5/32

  - [[19, 22, 25, 28, 37, 40, 43, 46, 52, 55, 58, 19], 1, YOLO26PSMergedSegment25D, [nc, kpt_shape, 32, 192, 150, 0, null, null, simple, 1, 256, 0, 4]]
